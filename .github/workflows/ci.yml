name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # Pairs taken from the official Elixir/Erlang compatibility table:
        #   1.18 -> OTP 25-27, 1.19 -> OTP 26-28, 1.20 -> OTP 27-29.
        # 1.20 is still a release candidate, so it is pinned to the exact RC the
        # project's .tool-versions baseline uses.
        include:
          - elixir: "1.18.1"
            otp: "27.0.1"
          - elixir: "1.19.5"
            otp: "28.1"
          - elixir: "1.20.0-rc.6"
            otp: "27.0.1"

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      # Conformance gate against the vendored upstream cucumber/gherkin corpus.
      # The conformance test asserts 100% pass in every area (AST/Pickles/Errors +
      # Markdown twins), so this exits non-zero on any regression.
      - name: Conformance gate
        run: mix conformance
